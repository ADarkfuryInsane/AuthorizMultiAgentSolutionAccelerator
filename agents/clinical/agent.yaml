# Foundry Hosted Agent descriptor — Clinical Reviewer Agent.
#
# Consumed by the `azd ai agent` extension at deploy time.
# The companion entry in repo-root azure.yaml under `services:`
# provides the build context and remoteBuild configuration.
#
# Schema reference:
# https://github.com/Azure-Samples/foundry-hosted-agentframework-demos/blob/main/agents/agent.yaml
#
# MCP tools (ICD-10, PubMed, ClinicalTrials.gov) are wired
# IN-CONTAINER via MCPStreamableHTTPTool in main.py.
#
# Hosted Agents v2 does not use the legacy MCPTool entries here.
# MCP server URLs are passed as environment variables and main.py
# converts them into in-process MCP tools.

kind: hosted

name: clinical-reviewer-agent

protocols:
  - protocol: responses
    version: "2.0.0"

environment_variables:
  # Model deployment name
  - name: MODEL_DEPLOYMENT_NAME
    value: ${AZURE_OPENAI_DEPLOYMENT_NAME}

  # Legacy/local-development fallback
  - name: AZURE_OPENAI_DEPLOYMENT_NAME
    value: ${AZURE_OPENAI_DEPLOYMENT_NAME}

  # Foundry project endpoint fallback
  - name: AZURE_AI_PROJECT_ENDPOINT
    value: ${AI_FOUNDRY_PROJECT_ENDPOINT}

  # Application Insights / OpenTelemetry connection string
  - name: OTEL_CONNECTION_STRING
    value: ${APPLICATION_INSIGHTS_CONNECTION_STRING}

  # ICD-10 MCP endpoint
  - name: MCP_ICD10_CODES
    value: https://hcls.mcp.claude.com/icd10_codes/mcp

  # PubMed MCP endpoint
  - name: MCP_PUBMED
    value: https://pubmed.mcp.claude.com/mcp

  # ClinicalTrials.gov MCP endpoint
  - name: MCP_CLINICAL_TRIALS
    value: https://hcls.mcp.claude.com/clinical_trials/mcp

tools: []